<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预习作业</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        @keyframes rainbow {
            0%{background-color: red;transform: scale(1);}
            14%{background-color: orange;transform: scale(1.2);}
            28%{background-color: yellow;transform: scale(1.5);}
            42%{background-color: green;transform: scale(1);}
            56%{background-color: cyan;transform: scale(1.5);}
            70%{background-color: blue;transform: scale(1);}
            84%{background-color: purple;transform: scale(1.5);}
            100%{background-color: red;transform: scale(1);}
        }
        .rainbow {
            animation: rainbow 10s linear infinite;
            width: 400px;
            height: 300px;
            margin: 300px auto;
            border-radius: 20px;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            line-height: 300px;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>
    <div class="rainbow">
        Hello world!
    </div>
</body>
</html>
