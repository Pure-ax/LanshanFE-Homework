<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    canvas{
        position: fixed;
        left: 0;
        top: 0;
        background-color: black;
        width: 100%;
        height: 100%;
    }
</style>

<body>
    <canvas>
        
    </canvas>

    <script>
        const cvs = document.querySelector('canvas')
        const ctx = cvs.getContext('2d')

        function init(){
            cvs.width = window.innerWidth * devicePixelRatio
            cvs.height = window.innerHeight * devicePixelRatio
        }
        init()

        function getRandom(min,max){
            return Math.floor(Math.random()*(max+1-min)+min)
        }
        class Point {
            constructor(){
                this.r = 15
                this.x = getRandom(this.r,cvs.width-this.r)
                this.y = getRandom(this.r,cvs.height-this.r)
                this.xSpeed = getRandom(-50,50)
                this.ySpeed = getRandom(-50,50)
                this.lastDrawTime = null
            }
            draw(){
                if(this.lastDrawTime){
                    const duration = (Date.now()-this.lastDrawTime)/1000
                    const xDis = this.xSpeed * duration
                    const yDis = this.ySpeed * duration
                    let x = this.x + xDis
                    let y = this.y + yDis
                    if(x>cvs.width-this.r){
                        x=cvs.width-this.r
                        this.xSpeed = -this.xSpeed
                    }
                    else if(x<this.r){
                        x=this.r
                        this.xSpeed = -this.xSpeed
                    }
                    if(y>cvs.height-this.r){
                        y=cvs.height-this.r
                        this.ySpeed = -this.ySpeed
                    }
                    else if(y<this.r){
                        y=this.r
                        this.ySpeed = -this.ySpeed
                    }
                    this.x = x
                    this.y = y
                }
                ctx.beginPath()
                ctx.arc(this.x,this.y,6,0,2*Math.PI)
                ctx.fillStyle = '#fff'
                ctx.fill()
                this.lastDrawTime = Date.now()
            }
        }
        class Gragh {
            constructor(pointNumber=42,maxDis=667){
                this.points = new Array(pointNumber).fill(0).map(()=>new Point())
                this.maxDis = maxDis
            }
            draw(){
                requestAnimationFrame(()=>{
                    this.draw()
                })
                ctx.clearRect(0,0,cvs.width,cvs.height)
                for(let i = 0; i < this.points.length; i++){
                    const p1 = this.points[i]
                    p1.draw()
                    for(let j = i+1; j < this.points.length; j++){
                        const p2 = this.points[j]
                        const d = Math.sqrt((p1.x-p2.x)**2+(p1.y-p2.y)**2)
                        if(d>this.maxDis){
                            continue
                        }
                        ctx.beginPath()
                        ctx.moveTo(p1.x,p1.y)
                        ctx.lineTo(p2.x,p2.y)
                        ctx.closePath
                        ctx.strokeStyle = `rgb(200,200,200,${1-d/this.maxDis})`
                        ctx.stroke()
                    }
                }
            }
        }

        const g = new Gragh()
        g.draw()

</body>
